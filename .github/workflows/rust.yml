name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    # TR2013 is 32-bit, so its overlay is built for i686 too (build.rs)
    - name: Add the 32-bit target
      run: rustup target add i686-pc-windows-msvc
    - name: Build
      run: cargo build --verbose
    # The 32-bit overlay was built above; this checks the code the 64-bit builds share with it
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
      env:
        TOMB_HELPER_SKIP_TR2013: 1
    - name: Run tests
      run: cargo test --verbose
