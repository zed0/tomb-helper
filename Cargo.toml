[package]
name = "tomb-helper"
version = "2.0.0-alpha.1"
authors = ["Ben Falconer <ben@falconers.me.uk>"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
process-memory = { git = "https://github.com/Tommoa/rs-process-memory.git", rev = "7b9b263932f16fc5864c294efbf338edb0010f39" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
hudhook = "0.9"
shared_memory = "0.12.4"
tracing-subscriber = "0.3.19"
signal-hook = "0.3.18"
nalgebra = "0.34.0"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
rayon = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "memoryapi", "minwindef", "processthreadsapi", "synchapi", "debugapi", "winbase", "minwinbase", "handleapi", "winerror", "errhandlingapi", "wow64apiset", "psapi", "winuser", "libloaderapi", "sysinfoapi", "tlhelp32"] }

[[bin]]
name = "tomb-helper"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]
name = "tomb_helper_ui"

[profile.dev]
lto = "thin"

[patch.'crates-io']
# imgui = { git = "https://github.com/imgui-rs/imgui-rs", rev = "cb8beeb" }
hudhook = { git = "https://github.com/zed0/hudhook", branch = "vtable-hooks" }
